# Parte fissa della config Samba 4 del NAS.
# Le share vengono aggiunte da smb4-genconf.sh leggendo /etc/samba/smb.conf (web UI Buffalo).
[global]
    # nome e workgroup vengono presi dalla smb.conf stock (web UI) da smb4-genconf.sh
    netbios name = NOME-NAS
    workgroup = WORKGROUP
    server string = CloudStor
    server role = standalone server
    security = user

    smb ports = 445 139
    # niente IPv6 nel kernel 2.6.31: bind solo IPv4 (anche per i socket RPC di samba-dcerpcd)
    interfaces = eth1 lo
    bind interfaces only = yes
    server min protocol = SMB2_02
    server max protocol = SMB3_11
    server multi channel support = no
    server signing = default
    server smb encrypt = default
    # AES-GMAC in software su ARMv5 è ~1 MB/s, AES-CMAC ~2,3 MB/s
    server smb3 signing algorithms = AES-128-CMAC

    map to guest = never
    guest account = nobody
    restrict anonymous = 2
    ntlm auth = ntlmv2-only
    unix password sync = no

    unix charset = UTF-8
    unix extensions = no
    veto files = /.AppleDesktop/Network Trash Folder/TheVolumeSettingsFolder/.AppleDouble/.AppleDB/.com.apple.timemachine.supported/
    delete veto files = yes
    deadtime = 15
    use sendfile = yes

    passdb backend = tdbsam:/mnt/array1/.buffalo-samba-test/prod/private/passdb.tdb
    private dir = /mnt/array1/.buffalo-samba-test/prod/private
    lock directory = /mnt/array1/.buffalo-samba-test/prod/var/lock
    state directory = /mnt/array1/.buffalo-samba-test/prod/var/state
    cache directory = /mnt/array1/.buffalo-samba-test/prod/var/cache
    ncalrpc dir = /mnt/array1/.buffalo-samba-test/prod/var/run/ncalrpc
    # /var/run/smbd.pid: lo controlla daemonwatch
    pid directory = /var/run

    log file = /mnt/array1/.buffalo-samba-test/prod/var/log/smbd.log
    max log size = 1000
    # auth_audit:2 registra i login falliti
    log level = 1 auth_audit:2

    load printers = no
    printing = bsd
    printcap name = /dev/null
    disable spoolss = yes

    # samba-dcerpcd lo avvia smb4-start.sh con solo i servizi utili (elenco share, LSA):
    # su ARMv5 ogni rpcd_* impiega ~10 s a partire, quindi i worker restano sempre vivi
    rpc start on demand helpers = no
    rpcd_epmapper:num_workers = 1
    rpcd_epmapper:idle_seconds = 31536000
    rpcd_classic:num_workers = 1
    rpcd_classic:idle_seconds = 31536000
    rpcd_winreg:num_workers = 1
    rpcd_winreg:idle_seconds = 31536000
    rpcd_lsad:num_workers = 1
    rpcd_lsad:idle_seconds = 31536000
